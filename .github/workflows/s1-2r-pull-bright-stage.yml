name: S1.2R Promote Bright Stage

on:
  push:
    branches:
      - work/s1-2r-bright-stage-reset
    paths:
      - .github/workflows/s1-2r-pull-bright-stage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote verified Bright Stage V1 to private runtime path
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -H 'content-type: application/json' \
            -d '{"op":"promote"}' \
            https://uaosdkrfxidiwqljmelg.supabase.co/functions/v1/p37-stage-bright-v1-ingest
          echo
          curl --fail-with-body -sS \
            -H 'content-type: application/json' \
            -d '{"op":"status"}' \
            https://uaosdkrfxidiwqljmelg.supabase.co/functions/v1/p37-stage-bright-v1-ingest
          echo

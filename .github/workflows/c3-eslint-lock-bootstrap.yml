name: C3 ESLint lockfile bootstrap (temporary)

on:
  push:
    branches:
      - work/mvp-entry-room-flow-v1
    paths:
      - package.json
      - .github/workflows/c3-eslint-lock-bootstrap.yml

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit lock for review and a subsequent work-branch commit
        run: |
          echo "C3_LOCKFILE_BEGIN"
          cat package-lock.json
          echo "C3_LOCKFILE_END"

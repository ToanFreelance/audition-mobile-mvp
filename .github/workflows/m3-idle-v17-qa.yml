name: M3 Waiting Room Idle V1.8.1 — Focused QA

on:
  push:
    branches:
      - work/m3-waiting-room-integration-v1
    paths:
      - components/character/motion/**
      - components/multiplayer/WaitingRoomStage3D.tsx
      - app/tools/lobby-qa-sketch/**
      - components/character/m3-lobby-idle.ts
      - e2e/m3-lobby-idle-v13.spec.ts
      - e2e/m3-idle-v17-visual.spec.ts
      - .github/workflows/m3-idle-v17-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-idle-v17-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m3-v18-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_TEST_BASE_URL: "http://127.0.0.1:3000"
      SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
      NEXT_PUBLIC_SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_2JSGSu_BFZAvyL1WEZ9VfA_u_wynW6V"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Synthetic rig regression + actual M3 render snapshots
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
        run: npx playwright test e2e/lobby-stage-identity.spec.ts e2e/m3-lobby-appearance.spec.ts e2e/m3-lobby-idle-v13.spec.ts e2e/m3-idle-v17-visual.spec.ts --project=desktop --workers=1 --retries=0
      - name: Upload screenshots and traces for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-idle-v181-visual-${{ github.run_id }}
          path: |
            test-results/m3-idle-v18/
            test-results/junit.xml
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

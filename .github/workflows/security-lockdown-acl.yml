name: Security lockdown isolated ACL QA
on:
  push:
    branches: [work/p5-7-match-warmup-v1]
    paths:
      - "docs/security/roomstate-write-lockdown*.sql"
      - "docs/security/music-content-readonly.pending.sql"
      - ".github/workflows/security-lockdown-acl.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-acl:
    if: github.ref == 'refs/heads/work/p5-7-match-warmup-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: acl_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acl_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending SQL and assert effective ACLs on disposable fixture
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: fixture-only
          PGDATABASE: acl_fixture
        run: psql -X -v ON_ERROR_STOP=1 -f docs/security/roomstate-write-lockdown.fixture.sql

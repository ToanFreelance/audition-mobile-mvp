name: Lobby targeted QA

on:
  push:
    branches:
      - work/lobby
  pull_request:
    branches:
      - development
    paths:
      - "components/multiplayer/**"
      - "multiplayer/**"
      - "app/api/multiplayer/**"
      - "e2e/multiplayer-transport.spec.ts"
      - "playwright.config.ts"
      - "package*.json"
      - ".github/workflows/lobby-qa.yml"

permissions:
  contents: read

jobs:
  lobby-targeted-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Targeted realtime transport QA
        run: npx playwright test e2e/multiplayer-transport.spec.ts e2e/lobby-presence.spec.ts e2e/lobby-stage-identity.spec.ts e2e/lobby-start-freeze.spec.ts --project=desktop --workers=1 --grep "foreground reconnect|presence projection|local guest remains visible|latched presence|authoritative guest leave|3D actor identity|lobby Start gate|Only host can freeze|immutable MatchManifest|later RoomState revision"

      - name: Upload QA report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lobby-targeted-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

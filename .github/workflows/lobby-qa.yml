name: Lobby QA QC

on:
  workflow_dispatch:
  pull_request:
    branches: [development]
  push:
    branches:
      - "work/**"
      - development
      - main
    paths:
      - "components/Stage3D.tsx"
      - "components/multiplayer/**"
      - "components/character/**"
      - "multiplayer/**"
      - "game/**"
      - "app/api/multiplayer/**"
      - "app/api/auth/**"
      - "app/api/account/**"
      - "app/auth/**"
      - "components/entry/**"
      - "lib/account-auth.ts"
      - "lib/room-actor-session.ts"
      - "lib/server-storage.ts"
      - "app/api/music-config/**"
      - "app/tools/lobby-qa/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package*.json"
      - ".github/workflows/lobby-qa.yml"
      - ".github/workflows/security-real-auth-duo.yml"
concurrency:
  group: lobby-qa-qc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  PLAYWRIGHT_TEST_BASE_URL: "http://127.0.0.1:3000"
  SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
  NEXT_PUBLIC_SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_2JSGSu_BFZAvyL1WEZ9VfA_u_wynW6V"

jobs:
  fast-lobby-qa:
    name: fast-lobby-qa
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint gate
        run: npm run lint

      - name: Focused lobby architecture regression
        run: npm run test:qa:lobby:fast

      - name: Focused integration regression
        run: >-
          npx playwright test
          e2e/entry-room-account-identity.spec.ts
          e2e/room-security-closeout.spec.ts
          e2e/m3-asset-timeout.spec.ts
          e2e/music-config-read-security.spec.ts
          e2e/p55-clock-recovery-effect.spec.ts
          e2e/preload-nonblocking-effect.spec.ts
          e2e/room-sync-recovery-effect.spec.ts
          e2e/performance-diagnostics.spec.ts
          e2e/entry-heartbeat-recovery.spec.ts
          e2e/m3-gameplay-step3.spec.ts
          e2e/m3-stage3d-integration-step31.spec.ts
          e2e/multiplayer-determinism.spec.ts
          e2e/published-animation-transport.spec.ts
          --project=desktop --workers=1

  static-build:
    name: static-build
    if: ${{ github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint gate
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Focused Auth and Haunted Classroom regression
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
        run: npx playwright test e2e/auth-account-v1.spec.ts e2e/s2-5c-haunted-classroom.spec.ts --project=desktop --workers=1

  core-regression-shard:
    needs: static-build
    name: core-regression (${{ matrix.shard }}/4)
    if: ${{ github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Full deterministic and browser regression suite
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
        run: npm run test:qa:core -- --shard=${{ matrix.shard }}/4

      - name: Upload core regression evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lobby-core-regression-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the existing required check name. All shards must succeed.
  core-regression:
    name: core-regression
    needs: core-regression-shard
    if: ${{ always() && (github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every core shard to pass
        env:
          SHARD_RESULT: ${{ needs.core-regression-shard.result }}
        run: test "$SHARD_RESULT" = success

  # Real Auth and signed Guest HTTPS QA runs independently on trusted
  # development pushes in security-real-auth-duo.yml. PR jobs never receive
  # the protected environment or its credentials.

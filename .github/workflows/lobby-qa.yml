name: Lobby QA QC

on:
  workflow_dispatch:
  push:
    branches:
      - work/lobby
  pull_request:
    branches:
      - development
    paths:
      - "components/multiplayer/**"
      - "components/character/**"
      - "multiplayer/**"
      - "game/**"
      - "app/api/multiplayer/**"
      - "app/api/music-config/**"
      - "app/tools/lobby-qa/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package*.json"
      - ".github/workflows/lobby-qa.yml"

concurrency:
  group: lobby-qa-qc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lobby-qa-qc:
    name: full-lobby-qa-qc
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      PLAYWRIGHT_TEST_BASE_URL: "http://127.0.0.1:3000"
      SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
      NEXT_PUBLIC_SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_2JSGSu_BFZAvyL1WEZ9VfA_u_wynW6V"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Core regression suite
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
        run: npm run test:qa:core

      - name: Real Host Guest browser E2E
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
        run: npm run test:qa:lobby:e2e

      - name: Upload QA QC evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lobby-qa-qc-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

name: Lobby QA QC

on:
  workflow_dispatch:
  push:
    branches:
      - "work/lobby*"
  pull_request:
    branches:
      - development
    paths:
      - "components/multiplayer/**"
      - "components/character/**"
      - "multiplayer/**"
      - "game/**"
      - "app/api/multiplayer/**"
      - "app/api/music-config/**"
      - "app/tools/lobby-qa/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package*.json"
      - ".github/workflows/lobby-qa.yml"

concurrency:
  group: lobby-qa-qc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  PLAYWRIGHT_TEST_BASE_URL: "http://127.0.0.1:3000"
  SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
  NEXT_PUBLIC_SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_2JSGSu_BFZAvyL1WEZ9VfA_u_wynW6V"

jobs:
  static-build:
    name: static-build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  core-regression:
    name: core-regression
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Full deterministic and browser regression suite
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
        run: npm run test:qa:core

      - name: Upload core regression evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lobby-core-regression-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  real-browser-e2e:
    name: real-host-guest-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Real Host Guest browser E2E
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
        run: npm run test:qa:lobby:e2e

      - name: Upload real-browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lobby-real-browser-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

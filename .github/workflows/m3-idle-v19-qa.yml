name: M3 Idle V1.9.1 — Nine-Clip Projection & Measurement Infrastructure QA
on:
  push:
    branches:
      - work/m3-waiting-room-integration-v1
    paths:
      - components/character/motion/**
      - scripts/m3-idle/blender_f01_v192.py
      - scripts/m3-idle/test_blender_f01_v192.py
      - scripts/m3-idle/reference_metrics_v19.py
      - scripts/m3-idle/test_reference_metrics_v19.py
      - scripts/m3-idle/reference_metrics_v191.py
      - scripts/m3-idle/test_reference_metrics_v191.py
      - scripts/m3-idle/review_tracks_v191.py
      - scripts/m3-idle/solve_reviewed_v191.py
      - scripts/m3-idle/test_reviewed_v191.py
      - scripts/m3-idle/world_estimates_v191.py
      - scripts/m3-idle/test_world_estimates_v191.py
      - e2e/m3-idle-v19-projection.spec.ts
      - components/character/m3-lobby-idle.ts
      - components/multiplayer/WaitingRoomStage3D.tsx
      - .github/workflows/m3-idle-v19-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-idle-v19-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measured-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_TEST_BASE_URL: "http://127.0.0.1:3000"
      SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
      NEXT_PUBLIC_SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_2JSGSu_BFZAvyL1WEZ9VfA_u_wynW6V"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python dependencies for 2D measurement
        run: python -m pip install --disable-pip-version-check numpy scipy opencv-python-headless
      - name: 2D measurement and nine-clip tracking audit (synthetic)
        run: python -m unittest discover -s scripts/m3-idle -p 'test_*v19*.py' -v
      - name: Node dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Export real nine-clip M3 rig pivots at 30Hz
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
        run: npx playwright test e2e/m3-idle-v19-projection.spec.ts --project=desktop --workers=1 --retries=0
      - name: Preserve samples, screenshots and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-idle-v19-projected-joints-${{ github.run_id }}
          path: |
            test-results/m3-idle-v19/
            test-results/junit.xml
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

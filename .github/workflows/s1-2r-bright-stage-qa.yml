name: S1.2R Bright Stage QA

on:
  push:
    branches:
      - work/s1-2r-bright-stage-reset
    paths:
      - components/Stage3D.tsx
      - components/GameShell.tsx
      - components/PortraitGameMenu.tsx
      - components/AuditionGauge.tsx
      - components/stage/BrightStageV1Environment.ts
      - components/stage/stageCamera.ts
      - app/api/stage-runtime/route.ts
      - app/globals.css
      - public/audition-final-overrides.css
      - public/audition-touch-overrides.css
      - e2e/stage-bright-v1.spec.ts
      - .github/workflows/s1-2r-bright-stage-qa.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  PLAYWRIGHT_TEST_BASE_URL: "http://127.0.0.1:3000"
  PLAYWRIGHT_WEB_SERVER: "1"

jobs:
  focused-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Bright Stage focused browser test
        run: npx playwright test e2e/stage-bright-v1.spec.ts --project=desktop --workers=1

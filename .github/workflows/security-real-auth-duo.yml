name: Security real Auth and M3 duo QA
on:
  push:
    branches: [work/p5-7-match-warmup-v1]
    paths:
      - "e2e/security-real-auth-duo.spec.ts"
      - "components/Stage3D.tsx"
      - "components/character/character-profile.ts"
      - "e2e/p57-real-benchmark.spec.ts"
      - "app/api/music-config/**"
      - "app/api/music-library/**"
      - ".github/workflows/security-real-auth-duo.yml"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: security-real-auth-duo
  cancel-in-progress: false
jobs:
  real-auth-duo:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/work/p5-7-match-warmup-v1' || github.ref == 'refs/heads/development')
    environment: security-auth-qa
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
      SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_2JSGSu_BFZAvyL1WEZ9VfA_u_wynW6V"
      PLAYWRIGHT_TEST_BASE_URL: "https://127.0.0.1:3443"
    steps:
      - uses: actions/checkout@v4
      - name: Require dedicated QA secret
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_QA_SECRET_KEY }}
        run: |
          if [[ "$SUPABASE_SERVICE_ROLE_KEY" != sb_secret_* ]]; then
            echo "::error::Missing environment secret SUPABASE_QA_SECRET_KEY in security-auth-qa"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run real two-account security QA
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_QA_SECRET_KEY }}
          SECURITY_AUTH_REAL_QA: "1"
          PLAYWRIGHT_WEB_SERVER: "1"
        run: |
          # Isolated ephemeral TLS; no weakening of production Secure cookies.
          export QA_TLS_DIR="$(mktemp -d)"
          trap 'rm -rf "$QA_TLS_DIR"' EXIT
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 -subj "/CN=localhost" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" -keyout "$QA_TLS_DIR/key.pem" -out "$QA_TLS_DIR/cert.pem" >/dev/null 2>&1
          export ROOM_GUEST_SESSION_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$ROOM_GUEST_SESSION_SECRET"
          npx playwright test e2e/security-real-auth-duo.spec.ts --project=desktop --workers=1 --retries=0 --reporter=list
          P57_REAL_BENCH=1 npx playwright test e2e/p57-real-benchmark.spec.ts --grep "2 human" --project=desktop --workers=1 --retries=0 --reporter=list
      # No upload of browser traces or credentials. Test prints only case status.

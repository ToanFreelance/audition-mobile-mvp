name: M3 Premium Cute Anime — Focused Visual QA

on:
  push:
    branches:
      - work/m3-premium-cute-visual-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-premium-cute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_TEST_BASE_URL: "http://127.0.0.1:3000"
      SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
      NEXT_PUBLIC_SUPABASE_URL: "https://uaosdkrfxidiwqljmelg.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_2JSGSu_BFZAvyL1WEZ9VfA_u_wynW6V"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Actual M3 creator, lobby and identity smoke
        env:
          PLAYWRIGHT_WEB_SERVER: "1"
        run: npx playwright test e2e/m3-premium-cute-visual.spec.ts e2e/m3-lobby-appearance.spec.ts e2e/lobby-stage-identity.spec.ts --project=desktop --workers=1 --retries=0 --max-failures=1
      - name: Upload true WebGL screenshots for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-premium-cute-${{ github.run_id }}
          path: |
            test-results/m3-premium-cute/
            test-results/junit.xml
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08051f"/><stop offset=".24" stop-color="#160532"/><stop offset=".50" stop-color="#3d0866"/><stop offset=".72" stop-color="#5a075d"/><stop offset="1" stop-color="#0a0628"/></linearGradient>
  <radialGradient id="center" cx="50%" cy="48%" r="45%"><stop offset="0" stop-color="#ff2ed2" stop-opacity=".62"/><stop offset=".28" stop-color="#bb25e6" stop-opacity=".38"/><stop offset=".62" stop-color="#5a16a8" stop-opacity=".14"/><stop offset="1" stop-color="#12042e" stop-opacity="0"/></radialGradient>

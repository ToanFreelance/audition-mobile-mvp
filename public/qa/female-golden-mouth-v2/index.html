<body><main><small>AUDITION · KIỂM TRA RIÊNG M01</small><h1>Golden Mouth V2 · Tự nhiên</h1><p>Môi chỉnh trên bề mặt đầu gốc bằng Blender. Giữ mắt Golden V8.</p>
<div class="layout"><section id="stage" aria-label="Khung nhìn nhân vật 3D"></section><aside>
<label class="file">Chọn Female_anime_origin.glb<input id="file" type="file" accept=".glb"></label><p>Đọc file trong Tệp trên thiết bị; không upload model.</p><div id="status" role="status">Chưa nạp GLB.</div>

<div class="row"><button id="original" disabled aria-pressed="false">So toàn bộ đầu gốc</button></div>

</aside></div></main><script type="module" src="./qa.js"></script></body></html>
